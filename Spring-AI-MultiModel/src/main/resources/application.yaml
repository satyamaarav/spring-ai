spring:
  application:
    name: Spring-AI-MultiModel

  openai:
    api-key: ${OPENAI_API_KEY}

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: codellama

# DISABLED: Ollama client is disabled to avoid conflicts with the server configuration
    chat:
      client:
        enabled: false

server:
  port: 8081
